[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "deep_learning_senai"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Ryan Bernardo" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "matplotlib>=3.10.9",
    "mkdocs",
    "pandas>=2.3.3",
    "pip",
    "pydot>=4.0.1",
    "python-dotenv",
    "ruff",
    "tensorflow>=2.21.0",
    "torch>=2.14.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["deep_learning_senai"]
include = ["pyproject.toml", "deep_learning_senai/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["deep_learning_senai"]
force-sort-within-sections = true

